<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/unthai-logo.png" />
  <link rel="apple-touch-icon" href="/unthai-logo.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#051224" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Security: Hostinger nginx ignores .htaccess. CSP + Referrer set via <meta>.
       For full HSTS / X-Frame-Options / Permissions-Policy → put Cloudflare in front. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.unth.ai https://www.google-analytics.com https://*.analytics.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <!-- Preload above-the-fold OG image (used by social cards + JSON-LD).
       NOTE: the hero LCP image is hashed by Vite, so its <link rel="preload">
       is injected from inside the React <Hero> component via useEffect. -->
  <link rel="preload" as="image" fetchpriority="high" href="/og-image.png" />
  <title>UNTH.AI — AI-Powered Creative & Automation Agency</title>
  <meta name="description" content="UNTH.AI builds AI systems, automation workflows, and content engines for businesses. We deliver results through intelligent automation, AI agents, and creative tools." />
  <meta name="keywords" content="AI agency, automation, AI agents, content creation, workflow automation, Bangkok, Thailand" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="author" content="UNTH.AI" />
  <link rel="canonical" href="https://unth.ai/" />

  <!-- Google Search Console verification — replace with real token when ready -->
  <!-- <meta name="google-site-verification" content="REPLACE_ME" /> -->

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://unth.ai/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="UNTH.AI" />
  <meta property="og:title" content="UNTH.AI — AI-Powered Creative & Automation Agency" />
  <meta property="og:description" content="We build AI systems, automation workflows, and content engines that deliver real results for your business." />
  <meta property="og:image" content="https://unth.ai/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@UnthaiHQ" />
  <meta name="twitter:creator" content="@UnthaiHQ" />
  <meta name="twitter:title" content="UNTH.AI — AI-Powered Creative & Automation Agency" />
  <meta name="twitter:description" content="We build AI systems, automation workflows, and content engines that deliver real results for your business." />
  <meta name="twitter:image" content="https://unth.ai/og-image.png" />

  <!-- JSON-LD: Organization (inline so crawlers without JS still see it) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "UNTH.AI",
    "url": "https://unth.ai",
    "logo": "https://unth.ai/unthai-logo.png",
    "description": "AI-powered creative and automation agency. Builds AI systems, agents, and content engines for businesses.",
    "sameAs": [
      "https://twitter.com/UnthaiHQ",
      "https://www.linkedin.com/company/unthai"
    ]
  }
  </script>

  <!-- Google Analytics is loaded by <CookieConsent /> only after the user
       grants consent (GDPR compliance). See src/components/CookieConsent.jsx -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
